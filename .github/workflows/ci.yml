name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.1.29
      - run: bun install
      - name: Targeted unit tests
        run: bash scripts/ci-unit.sh
      - name: No-key CLI
        run: |
          bun packages/cli/src/index.ts --version
          bun packages/cli/src/index.ts --help
          bun packages/cli/src/index.ts completions bash
          bun packages/cli/src/index.ts sessions
          bun packages/cli/src/index.ts config
          tmp=$(mktemp -d)
          (cd "$tmp" && bun "$GITHUB_WORKSPACE/packages/cli/src/index.ts" init)
          test -f "$tmp/AGENTS.md"
          bun packages/cli/src/index.ts doctor || true
