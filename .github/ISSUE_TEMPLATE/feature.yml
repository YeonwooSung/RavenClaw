name: Feature
description: A change or new command
title: '[feat] '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: See CONTRIBUTING.md for how to add a CLI command.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or missing today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should RavenClaw do instead?
    validations:
      required: true
  - type: dropdown
    id: needs-key
    attributes:
      label: Does this need an API key to use?
      options:
        - 'No'
        - 'Yes'
        - Not sure
    validations:
      required: true
